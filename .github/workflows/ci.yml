name: CI

on:
  push:
    branches: [master]
  pull_request:

# E2E (Playwright) is not run here: it needs the humanOS-backend Docker stack and Mailpit.
jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # postinstall runs `nuxt prepare`, which generates .nuxt (needed by ESLint and typecheck).
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test
